<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RocketRules · 自选分流</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#0b1120;color:#e9eef9}*{box-sizing:border-box}body{max-width:900px;margin:0 auto;padding:32px 20px}h1{font-size:clamp(32px,6vw,52px);margin:12px 0}p{color:#aab8d0;line-height:1.7}.panel{background:#151f34;border:1px solid #2c3c55;border-radius:18px;padding:24px;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid #34445e;border-radius:12px;cursor:pointer}label:has(input:checked){background:#18344c;border-color:#5cbcf5}input{accent-color:#55bbfa;width:18px;height:18px}button{border:0;background:#55bbfa;color:#071626;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;margin:5px 7px 5px 0}button.secondary{background:#2d3e59;color:#eaf2ff}textarea{width:100%;height:240px;background:#0c1629;color:#bfe8ff;border:1px solid #34445e;border-radius:12px;padding:14px;font:12px/1.6 monospace}small{color:#9caec7}a{color:#79c9ff}code{overflow-wrap:anywhere}</style></head><body><h1>🚀 RocketRules</h1><p>选择哪些网站走 Shadowrocket VPN，其余全部直连。无需注册、无需服务器；你的选择仅保存在网址参数中。</p><section class="panel"><h2>选择代理规则</h2><div class="grid" id="rules"></div><p><button id="all" class="secondary">全选</button><button id="none" class="secondary">清空</button></p></section><section class="panel"><h2>生成配置</h2><p>默认仅 Meta 与两个 IP 检测网站走 VPN。下载后在 Shadowrocket 的「配置」中导入，并选择已有代理节点。</p><button id="download">下载 .conf</button><button id="copy" class="secondary">复制分享网址</button><button id="copyconf" class="secondary">复制配置文本</button><p id="status" role="status"></p><textarea id="output" spellcheck="false" readonly></textarea></section><p><small>提示：分享网址打开的是本网页并恢复勾选项，不是可直接添加为远程配置的 .conf 链接。若需要长期固定的远程订阅 URL，应将生成的 .conf 提交到仓库后使用 GitHub Raw 地址。部分服务可能使用未收录的域名或 IP。</small></p><script>const groups={"meta":["facebook.com","facebook.net","fb.com","fbcdn.net","fbsbx.com","fb.me","fb.watch","facebookmail.com","instagram.com","cdninstagram.com","ig.me","threads.net","threads.com","whatsapp.com","whatsapp.net","wa.me","messenger.com","m.me","meta.com","meta.ai","metaverse.com","oculus.com","oculuscdn.com"],"openai":["openai.com","chatgpt.com","oaistatic.com","oaiusercontent.com"],"claude":["anthropic.com","claude.ai"],"gemini":["gemini.google.com","generativelanguage.googleapis.com","aistudio.google.com"],"grok":["x.ai","grok.com"],"youtube":["youtube.com","youtu.be","googlevideo.com","ytimg.com"],"tiktok":["tiktok.com","tiktokcdn.com","tiktokv.com"],"telegram":["telegram.org","t.me","telegram.me"],"x":["x.com","twitter.com","twimg.com","t.co"],"discord":["discord.com","discord.gg","discordapp.com","discordapp.net"],"netflix":["netflix.com","nflxvideo.net","nflximg.net"],"ip":["ipinfo.io","ipleak.net"]},labels={"meta":"Meta 全家桶","openai":"ChatGPT / OpenAI","claude":"Claude","gemini":"Gemini","grok":"Grok / xAI","youtube":"YouTube","tiktok":"TikTok","telegram":"Telegram","x":"X / Twitter","discord":"Discord","netflix":"Netflix","ip":"IP 测试网站"};const keys=Object.keys(groups);const query=new URLSearchParams(location.search);const selected=new Set(query.has('r')?query.get('r').split(',').filter(x=>keys.includes(x)):['meta','ip']);const el=document.getElementById('rules');keys.forEach(k=>{let l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=selected.has(k);i.addEventListener('change',()=>{i.checked?selected.add(k):selected.delete(k);render()});l.append(i,document.createTextNode(labels[k]));el.append(l)});function config(){let a=['# RocketRules generated config','# Selected: '+[...selected].join(', '),'[General]','bypass-system = true','dns-server = system','','[Rule]'];let seen=new Set;keys.filter(k=>selected.has(k)).forEach(k=>{a.push('# '+labels[k]);groups[k].forEach(d=>{if(!seen.has(d)){a.push('DOMAIN-SUFFIX,'+d+',PROXY');seen.add(d)}})});a.push('FINAL,DIRECT');return a.join('\n')+'\n'}function url(){let u=new URL(location.href);u.searchParams.set('r',keys.filter(k=>selected.has(k)).join(','));return u.href}function render(){document.getElementById('output').value=config();document.querySelectorAll('#rules input').forEach((i,n)=>i.checked=selected.has(keys[n]));history.replaceState(null,'',url())}function status(s){document.getElementById('status').textContent=s}document.getElementById('all').onclick=()=>{keys.forEach(k=>selected.add(k));render()};document.getElementById('none').onclick=()=>{selected.clear();render()};document.getElementById('download').onclick=()=>{const b=new Blob([config()],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='RocketRules.conf';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status('配置已生成，请在 Shadowrocket 中导入')};async function copy(s){try{await navigator.clipboard.writeText(s);status('已复制')}catch(e){status('复制失败，请手动选择复制')}}document.getElementById('copy').onclick=()=>copy(url());document.getElementById('copyconf').onclick=()=>copy(config());render();</script></body></html>
